name: CI and Release Checks

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build documentation
        env:
          READTHEDOCS: "True"
        run: |
          python -m pip install . -r requirements/docs.txt
          make -C docs html SPHINXOPTS=-W

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install rcp and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt
      - name: Ruff lint
        run: ruff check rcp .github/scripts
      - name: Ruff format check
        run: ruff format --check rcp .github/scripts
      - name: Codespell
        run: codespell rcp README.md docs CHANGELOG.md pyproject.toml MANIFEST.in .codespellrc requirements/ci.txt requirements/docs.txt .readthedocs.yaml .github/workflows/ci.yml .github/release-files.json .github/scripts/check_release_contents.py
      - name: Pylint import and circular import checks
        run: pylint --disable=all --enable=E0401,E0402,E0611,R0401 rcp
      - name: Check source distribution manifest
        run: check-manifest

  package-build:
    name: Build package
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Clean previous build artifacts
        run: rm -rf build dist ./*.egg-info
      - name: Build source distribution and wheel
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  build-inspection:
    name: Inspect the build
    needs: [checks, package-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build check tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Inspect wheel contents
        run: python -m zipfile -l dist/*.whl
      - name: Inspect source distribution contents
        run: tar -tzf dist/*.tar.gz

  build-check:
    name: Check the build against source
    needs: [checks, package-build, build-inspection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Check package contents against allowlist
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python .github/scripts/check_release_contents.py --dist-dir dist

  publish:
    needs: [checks, package-build, build-inspection, build-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
