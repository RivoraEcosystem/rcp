[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rivora-rcp"
version = "2.0.0"
description = "Rivora Contract Protocol (RCP) interface specification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Bhavya Malhotra" }
]

keywords = [
    "rcp",
    "rivora",
    "riven",
    "http3",
    "quic",
    "webtransport",
    "framework",
    "server"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://github.com/RivoraEcosystem/rcp"
Repository = "https://github.com/RivoraEcosystem/rcp"
Issues = "https://github.com/RivoraEcosystem/rcp/issues"
Changelog = "https://github.com/RivoraEcosystem/rcp/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rcp*"]
namespaces = false
exclude = [
    "venv*",
    ".venv*",
    "env*",
    "build*",
    "dist*",
    "*.egg-info*"
]